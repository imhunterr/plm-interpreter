[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "plm-interp"
version = "0.1.0"
description = "PLM Interpreter: mechanistic interpretability of ESM-2 variant-effect predictions"
requires-python = ">=3.11"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]